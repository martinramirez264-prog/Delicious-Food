<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú - Delicious Food</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#193965}.layout{min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:#193965;padding:24px 18px;color:white}
.logo{text-align:center;margin-bottom:28px}.logo h1{font-size:24px}.logo p{color:#f28a00;font-size:11px;font-weight:bold;margin-top:5px}
nav a{display:block;color:white;text-decoration:none;padding:13px 15px;border-radius:8px;margin:5px 0}nav a:hover,nav a.active{background:#f28a00}
main{margin-left:250px;padding:30px;min-height:100vh}h2{font-size:28px;margin-bottom:7px}.sub{color:#666;margin-bottom:25px}
.panel{background:white;border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 3px 12px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 3px 12px #0001}
.badge{display:inline-block;padding:6px 10px;border-radius:15px;font-size:12px;font-weight:bold;background:#fff0d9;color:#d97900}
.blue{background:#e8f0ff;color:#245da8}.green{background:#e6f7eb;color:#23833d}.red{background:#ffe7e7;color:#b42318}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee}
.foodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}.food{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0001;text-decoration:none;color:#193965}.food img{width:100%;height:130px;object-fit:cover}.food div{padding:13px}.food h3{cursor:pointer}.food{transition:transform .2s,box-shadow .2s}.food:hover{transform:translateY(-3px);box-shadow:0 6px 18px #0002}.price{color:#f28a00;font-weight:bold;margin-top:6px}
.notice{padding:15px;border-radius:9px;background:#fafafa;margin:8px 0;border-left:5px solid #f28a00}.notice strong{display:block;margin-bottom:4px}
@media(max-width:700px){.sidebar{width:195px}main{margin-left:195px;padding:18px}}
</style>
</head><body><div class="layout">
<aside class="sidebar">
<div class="logo"><h1>🍔 Delicious Food</h1><p>PANEL DE JEFES</p></div>
<nav>
<a href="jefe.html">📊 Inicio</a>
<a href="pedidos.html">📦 Pedidos</a>
<a href="comidas.html">🍔 Comidas</a>
<a href="menu.html">📋 Menú</a>
<a href="imagenes.html">🖼️ Imágenes</a>
<a href="#">👥 Empleados</a><a href="#">🏪 Local</a><a href="#">⚙️ Configuración</a>
</nav></aside>
<main><h2>📋 Menú</h2><p class="sub">Carta de Delicious Food.</p><section class="foodgrid" id="foodgrid">
  <div class="notice" id="cargando">Cargando comidas desde la base de datos...</div>
</section>

<script>
async function cargarComidas() {
  const grid = document.getElementById("foodgrid");

  try {
    const respuesta = await fetch("api/comidas.php", {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store"
    });

    const datos = await respuesta.json();

    if (!respuesta.ok || !datos.ok) {
      throw new Error(datos.mensaje || "No se pudieron cargar las comidas.");
    }

    if (!datos.comidas || datos.comidas.length === 0) {
      grid.innerHTML = '<div class="notice"><strong>Sin comidas</strong>No hay comidas disponibles en la base de datos.</div>';
      return;
    }

    grid.innerHTML = datos.comidas.map(comida => {
      const imagen = comida.imagen && comida.imagen.trim()
        ? comida.imagen
        : "imgs/Hamburguesa.jpg";

      const precio = Number(comida.precio || 0).toLocaleString("es-AR", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

      return `
        <a class="food" href="${({1:"comida-hamburguesa.html",2:"comida-pizza.html",3:"comida-papas.html",4:"comida-sandwich.html"}[Number(comida.id_comida)] || "pedidos.html")}">
          <img src="${escapeHtml(imagen)}"
               alt="${escapeHtml(comida.nombre)}"
               onerror="this.src='imgs/Hamburguesa.jpg'">
          <div>
            <h3>${escapeHtml(comida.nombre)}</h3>
            ${comida.categoria ? `<span class="badge">${escapeHtml(comida.categoria)}</span>` : ""}
            <p class="price">$${precio}</p>
          </div>
        </a>
      `;
    }).join("");

  } catch (error) {
    grid.innerHTML = `
      <div class="notice">
        <strong>No se pudieron cargar las comidas</strong>
        ${escapeHtml(error.message)}
      </div>`;
    console.error(error);
  }
}

function escapeHtml(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[caracter]));
}

cargarComidas();
</script></main></div></body></html>
