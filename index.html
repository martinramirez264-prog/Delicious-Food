<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delicious Food | Iniciar sesión</title>

    <style>
        :root {
            --azul: #17365f;
            --azul-oscuro: #102744;
            --naranja: #e9820c;
            --naranja-hover: #cc6f06;
            --blanco: #ffffff;
            --crema: #fffdf9;
            --gris: #6f7785;
            --borde: #dfe3e8;
            --rojo: #d64545;
            --verde: #29945a;
        }

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    font-family: "Segoe UI", Arial, sans-serif;

    background: url("imgs/Comidas.jpg") center/cover no-repeat;

    color: var(--azul);
}

        /* TARJETA */

        .login-card {
            width: 410px;
            max-width: 100%;

            padding: 34px 32px 30px;

            background: var(--crema);

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            animation: aparecer 0.35s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO */

        .logo {
            width: 190px;
            max-width: 80%;

            display: block;

            margin: 0 auto 12px;
        }

        /* TITULO */

        .encabezado {
            text-align: center;
            margin-bottom: 28px;
        }

        .encabezado h1 {
            margin: 0;

            font-size: 25px;
            font-weight: 800;

            color: var(--azul);
        }

        .encabezado p {
            margin: 7px 0 0;

            font-size: 14px;
            color: var(--gris);
        }

        .decoracion {
            width: 55px;
            height: 4px;

            margin: 12px auto 0;

            border-radius: 20px;

            background: var(--naranja);
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: var(--azul);
        }

        .input-contenedor {
            position: relative;
        }

        .icono {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            width: 18px;
            height: 18px;

            color: var(--gris);

            pointer-events: none;
        }

        .input-contenedor input {
            width: 100%;

            height: 48px;

            padding: 0 45px 0 43px;

            border: 1px solid var(--borde);
            border-radius: 12px;

            outline: none;

            background: var(--blanco);

            color: var(--azul);

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-contenedor input::placeholder {
            color: #a1a8b3;
        }

        .input-contenedor input:focus {
            border-color: var(--naranja);

            box-shadow:
                0 0 0 3px rgba(233, 130, 12, 0.12);
        }

        /* OJO */

        .boton-ojo {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 8px;

            background: transparent;

            cursor: pointer;

            color: var(--gris);

            font-size: 18px;
        }

        .boton-ojo:hover {
            background: #f1f3f6;
        }

        /* BOTON LOGIN */

        .btn-login {
            width: 100%;

            height: 49px;

            margin-top: 5px;

            border: none;
            border-radius: 12px;

            background: var(--naranja);

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-login:hover {
            background: var(--naranja-hover);

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(233, 130, 12, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* MENSAJE */

        #mensaje-login {
            min-height: 20px;

            margin: 13px 0 0;

            text-align: center;

            font-size: 13px;
            font-weight: 600;
        }

        /* REGISTRO */

        .registro {
            margin-top: 24px;

            padding-top: 20px;

            border-top: 1px solid var(--borde);

            text-align: center;

            font-size: 13.5px;

            color: var(--gris);
        }

        .registro a {
            color: #2868d3;

            font-weight: 700;

            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        /* PIE */

        .pie {
            margin-top: 18px;

            text-align: center;

            font-size: 11px;

            color: #9aa1ac;
        }

        /* RESPONSIVE */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 28px 22px 25px;

                border-radius: 20px;
            }

            .logo {
                width: 170px;
            }

            .encabezado h1 {
                font-size: 22px;
            }
        }

        .ojo {
    position: relative;
    display: inline-block;
    font-size: 17px;
    line-height: 1;
}

.ojo.tachado::after {
    content: "";

    position: absolute;

    width: 25px;
    height: 2px;

    background: #6f7785;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-45deg);

    border-radius: 2px;
}

    </style>
</head>


<body>

    <main class="login-card">

        <!-- LOGO -->
        <img
            class="logo"
            src="imgs/Logo de Delicious Food sin fondo.png"
            alt="Logo de Delicious Food"
        >


        <!-- ENCABEZADO -->
        <div class="encabezado">

            <h1>Iniciar sesión</h1>

            <p>Ingresá para continuar a Delicious Food</p>

            <div class="decoracion"></div>

        </div>


        <!-- USUARIO -->
        <div class="campo">

            <label for="user">
                Usuario o correo electrónico
            </label>

            <div class="input-contenedor">

                <!-- Icono usuario -->
                <svg
                    class="icono"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>

                <input
                    id="user"
                    type="text"
                    placeholder="Ingresá tu usuario o correo"
                    autocomplete="username"
                >

            </div>

        </div>


        <!-- CONTRASEÑA -->
        <div class="campo">

            <label for="pass">
                Contraseña
            </label>

            <div class="input-contenedor">

                <!-- Icono candado -->
                <svg
                    class="icono"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>

                <input
                    id="pass"
                    type="password"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                    onkeydown="if(event.key === 'Enter') iniciarSesion()"
                >

                <button
                  class="boton-ojo"
                  type="button"
                  onclick="togglePass()"
                  aria-label="Mostrar u ocultar contraseña"
                > 
                  <span class="ojo">👁</span>
              
                </button>

            </div>

        </div>


        <!-- BOTON -->
        <button
            class="btn-login"
            type="button"
            onclick="iniciarSesion()"
        >
            Iniciar sesión
        </button>


        <!-- MENSAJE -->
        <p id="mensaje-login"></p>


        <!-- REGISTRO -->
        <div class="registro">

            ¿No tenés una cuenta?

            <a href="registro.html">
                Crear cuenta
            </a>

        </div>


        <!-- PIE -->
        <div class="pie">
            © 2026 Delicious Food
        </div>

    </main>


    <script>

        /* MOSTRAR / OCULTAR CONTRASEÑA */

        function togglePass() {
    const password = document.getElementById("pass");
    const ojo = document.querySelector(".ojo");

    if (password.type === "password") {
        password.type = "text";
        ojo.classList.remove("tachado");
    } else {
        password.type = "password";
        ojo.classList.add("tachado");
    }
}


        /* BUSCAR USUARIO */

        function buscarUsuario(dato) {

            // Primero intenta buscar directamente por usuario
            const contraseña = localStorage.getItem(dato);

            if (contraseña !== null) {

                return {
                    usuario: dato,
                    contraseña: contraseña
                };

            }


            // Si no encontró usuario,
            // busca por correo electrónico

            for (let i = 0; i < localStorage.length; i++) {

                const clave = localStorage.key(i);

                if (clave && clave.startsWith("correo_")) {

                    const usuario = clave.substring(7);

                    const correoGuardado =
                        localStorage.getItem(clave);

                    if (
                        correoGuardado &&
                        correoGuardado.toLowerCase() === dato.toLowerCase()
                    ) {

                        return {
                            usuario: usuario,
                            contraseña: localStorage.getItem(usuario)
                        };

                    }
                }
            }


            return null;
        }


        /* INICIAR SESIÓN */

        function iniciarSesion() {

            const dato =
                document.getElementById("user").value.trim();

            const clave =
                document.getElementById("pass").value;

            const mensaje =
                document.getElementById("mensaje-login");


            /* CAMPOS VACÍOS */

            if (dato === "" || clave === "") {

                mensaje.textContent =
                    "⚠️ Completá usuario y contraseña.";

                mensaje.style.color = "#d64545";

                return;
            }


            /* BUSCAR CUENTA */

            const cuenta = buscarUsuario(dato);


            if (cuenta === null) {

                mensaje.textContent =
                    "❌ Usuario o correo no encontrado.";

                mensaje.style.color = "#d64545";

                return;
            }


            /* COMPROBAR CONTRASEÑA */

            if (clave !== cuenta.contraseña) {

                mensaje.textContent =
                    "❌ Contraseña incorrecta.";

                mensaje.style.color = "#d64545";

                return;
            }


            /* LOGIN CORRECTO */

            mensaje.textContent =
                "✅ Inicio de sesión correcto.";

            mensaje.style.color = "#29945a";


            /* GUARDAR USUARIO ACTIVO */

            localStorage.setItem(
                "usuarioActivo",
                cuenta.usuario
            );


            /* IR AL HOME */

            setTimeout(function () {

                window.location.href = "home.html";

            }, 700);

        }

    </script>

</body>

</html>
