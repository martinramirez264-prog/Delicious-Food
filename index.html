<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delicious Food | Iniciar sesión</title>

    <style>
        :root {
            --azul: #17365f;
            --azul-oscuro: #102744;
            --naranja: #e9820c;
            --naranja-hover: #cc6f06;
            --blanco: #ffffff;
            --crema: #fffdf9;
            --gris: #6f7785;
            --borde: #dfe3e8;
            --rojo: #d64545;
            --verde: #29945a;
        }

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    font-family: "Segoe UI", Arial, sans-serif;

    background: url("imgs/Comidas.jpg") center/cover no-repeat;

    color: var(--azul);
}

        /* TARJETA */

        .login-card {
            width: 410px;
            max-width: 410px;
            padding: 22px 32px 18px;
                background: var(--crema);
            border-radius: 24px;
            box-shadow:0 25px 60px rgba(0, 0, 0, 0.35);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO */

        .logo {
            width: 155px;
            max-width: 80%;

            display: block;

            margin: 0 auto 6px;
        }

        /* TITULO */

        .encabezado {
            text-align: center;
            margin-bottom: 12px;
        }

        .encabezado h1 {
            margin: 0;

            font-size: 25px;
            font-weight: 800;

            color: var(--azul);
        }

        .encabezado p {
            margin: 4px 0 0;

            font-size: 14px;
            color: var(--gris);
        }

        .decoracion {
            width: 55px;
            height: 4px;

            margin: 7px auto 0;

            border-radius: 20px;

            background: var(--naranja);
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: var(--azul);
        }

        .input-contenedor {
            position: relative;
        }

        .icono {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            width: 18px;
            height: 18px;

            color: var(--gris);

            pointer-events: none;
        }

        .input-contenedor input {
            width: 100%;

            height: 44px;

            padding: 0 45px 0 43px;

            border: 1px solid var(--borde);
            border-radius: 12px;

            outline: none;

            background: var(--blanco);

            color: var(--azul);

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-contenedor input::placeholder {
            color: #a1a8b3;
        }

        .input-contenedor input:focus {
            border-color: var(--naranja);

            box-shadow:
                0 0 0 3px rgba(233, 130, 12, 0.12);
        }

        /* OJO */

        .boton-ojo {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 8px;

            background: transparent;

            cursor: pointer;

            color: var(--gris);

            font-size: 18px;
        }

        .boton-ojo:hover {
            background: #f1f3f6;
        }

        /* BOTON LOGIN */

        .btn-login {
            width: 100%;

            height: 46px;

            margin-top: 5px;

            border: none;
            border-radius: 12px;

            background: var(--naranja);

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-login:hover {
            background: var(--naranja-hover);

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(233, 130, 12, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* MENSAJE */

        #mensaje-login {
            min-height: 20px;

            margin: 7px 0 0;

            text-align: center;

            font-size: 13px;
            font-weight: 600;
        }

        /* REGISTRO */

        .registro {
            margin-top: 15px;

            padding-top: 12px;

            border-top: 1px solid var(--borde);

            text-align: center;

            font-size: 13.5px;

            color: var(--gris);
        }

        .registro a {
            color: #2868d3;

            font-weight: 700;

            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        /* PIE */

        .pie {
            margin-top: 10px;

            text-align: center;

            font-size: 11px;

            color: #9aa1ac;
        }

        /* RESPONSIVE */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 28px 22px 25px;

                border-radius: 20px;
            }

            .logo {
                width: 170px;
            }

            .encabezado h1 {
                font-size: 22px;
            }
        }

        .ojo {
    position: relative;
    display: inline-block;
    font-size: 17px;
    line-height: 1;
}

.ojo.tachado::after {
    content: "";

    position: absolute;

    width: 25px;
    height: 2px;

    background: #6f7785;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-45deg);

    border-radius: 2px;
}
    /* ===== HACER EL LOGIN MÁS PEQUEÑO ===== */

.login-container {
    padding: 15px 25px !important;
}

.logo {
    width: 110px !important;
    height: 110px !important;
    margin-bottom: 5px !important;
}

.login-container h1 {
    font-size: 23px !important;
    margin-bottom: 5px !important;
}

.login-container .subtitulo {
    font-size: 12px !important;
    margin-bottom: 8px !important;
}

.decoracion {
    margin: 5px auto 12px !important;
}

.form-group {
    margin-bottom: 9px !important;
}

.form-group label {
    font-size: 12px !important;
    margin-bottom: 4px !important;
}

.form-group input {
    height: 40px !important;
    font-size: 13px !important;
    padding: 8px 12px !important;
}

.login-button {
    height: 44px !important;
    font-size: 14px !important;
    margin-top: 5px !important;
}

.recuperar {
    margin-top: 7px !important;
    font-size: 12px !important;
}

        /* ===== LOGIN COMPACTO ===== */
        .login-card {
            padding: 22px 32px 18px;
        }

        .logo {
            width: 155px;
            margin: 0 auto 6px;
        }

        .encabezado {
            margin-bottom: 18px;
        }

        .encabezado p {
            margin-top: 4px;
        }

        .decoracion {
            margin-top: 7px;
        }

        .campo {
            margin-bottom: 12px;
        }

        .campo label {
            margin-bottom: 5px;
        }

        .input-contenedor input {
            height: 44px;
        }

        .btn-login {
            height: 46px;
            margin-top: 3px;
        }

        #mensaje-login {
            min-height: 16px;
            margin: 7px 0 0;
        }

        .recuperar {
            margin-top: 10px !important;
        }

        .registro {
            margin-top: 15px;
            padding-top: 12px;
        }

        .pie {
            margin-top: 10px;
        }

        @media (max-height: 750px) {
            body {
                padding: 12px;
            }

            .login-card {
                padding-top: 14px;
                padding-bottom: 12px;
            }

            .logo {
                width: 125px;
                margin-bottom: 3px;
            }

            .encabezado {
                margin-bottom: 12px;
            }

            .encabezado h1 {
                font-size: 23px;
            }

            .campo {
                margin-bottom: 9px;
            }

            .campo label {
                margin-bottom: 3px;
            }

            .input-contenedor input {
                height: 40px;
            }

            .btn-login {
                height: 44px;
            }

            .registro {
                margin-top: 11px;
                padding-top: 9px;
            }

            .pie {
                margin-top: 7px;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 18px 22px 15px;
            }
        }

    </style>
</head>


<body>

    <main class="login-card">

        <!-- LOGO -->
        <img
            class="logo"
            src="imgs/Logo de Delicious Food sin fondo.png"
            alt="Logo de Delicious Food"
        >


        <!-- ENCABEZADO -->
        <div class="encabezado">

            <h1>Iniciar sesión</h1>

            <p>Ingresá para continuar a Delicious Food</p>

            <div class="decoracion"></div>

        </div>


        <!-- USUARIO -->
        <div class="campo">

            <label for="user">
                Usuario o correo electrónico
            </label>

            <div class="input-contenedor">

                <!-- Icono usuario -->
                <svg
                    class="icono"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>

                <input
                    id="user"
                    type="text"
                    placeholder="Ingresá tu usuario o correo"
                    autocomplete="username"
                >

            </div>

        </div>


        <!-- CONTRASEÑA -->
        <div class="campo">

            <label for="pass">
                Contraseña
            </label>

            <div class="input-contenedor">

                <!-- Icono candado -->
                <svg
                    class="icono"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>

                <input
                    id="pass"
                    type="password"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                    onkeydown="if(event.key === 'Enter') iniciarSesion()"
                >

                <button
                  class="boton-ojo"
                  type="button"
                  onclick="togglePass()"
                  aria-label="Mostrar u ocultar contraseña"
                > 
                  <span class="ojo">👁</span>
              
                </button>

            </div>

        </div>


        <!-- BOTON -->
        <button
            class="btn-login"
            type="button"
            onclick="iniciarSesion()"
        >
            Iniciar sesión
        </button>


        <!-- MENSAJE -->
        <p id="mensaje-login"></p>


        <!-- RECUPERAR CONTRASEÑA -->
      <div class="recuperar" style="text-align: center;">
            <a href="restaurar.html">¿Olvidaste tu contraseña?</a> 
        </div>

        <!-- REGISTRO -->
        <div class="registro">

            ¿No tenés una cuenta?

            <a href="registro.html">
                Crear cuenta
            </a>

        </div>


        <!-- PIE -->
        <div class="pie">
            © 2026 Delicious Food
        </div>

    </main>


    <script>
/* MOSTRAR / OCULTAR CONTRASEÑA */
function togglePass() {
    const password = document.getElementById("pass");
    const ojo = document.querySelector(".ojo");

    if (password.type === "password") {
        password.type = "text";
        ojo.classList.remove("tachado");
    } else {
        password.type = "password";
        ojo.classList.add("tachado");
    }
}

/* INICIAR SESIÓN CONTRA MYSQL A TRAVÉS DE PHP */
async function iniciarSesion() {
    const dato = document.getElementById("user").value.trim();
    const clave = document.getElementById("pass").value;
    const mensaje = document.getElementById("mensaje-login");

    if (dato === "" || clave === "") {
        mensaje.textContent = "⚠️ Completá usuario y contraseña.";
        mensaje.style.color = "#d64545";
        return;
    }

    mensaje.textContent = "⏳ Verificando...";
    mensaje.style.color = "#777";

    const datos = new URLSearchParams();
    datos.append("usuario", dato);
    datos.append("clave", clave);

    try {
        const respuesta = await fetch("api/login.php", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: datos.toString(),
            credentials: "same-origin"
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            mensaje.textContent = "❌ " + (resultado.mensaje || "No se pudo iniciar sesión.");
            mensaje.style.color = "#d64545";
            return;
        }

        mensaje.textContent = "✅ Inicio de sesión correcto.";
        mensaje.style.color = "#29945a";

        // Solo guardamos datos no sensibles para la interfaz.
        // La autenticación real queda en la sesión PHP.
        sessionStorage.setItem("usuarioActivo", resultado.usuario.usuario);
        sessionStorage.setItem("rolActivo", resultado.usuario.rol);

        setTimeout(function () {
            window.location.href = resultado.redirect.replace("../", "");
        }, 700);

    } catch (error) {
        console.error(error);
        mensaje.textContent =
            "❌ No se pudo conectar con el servidor. ¿Apache y MySQL están encendidos?";
        mensaje.style.color = "#d64545";
    }
}
</script>
</body>
</html>
