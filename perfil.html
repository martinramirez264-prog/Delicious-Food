<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delicious Food | Mi Perfil</title>

    <link rel="stylesheet" href="style.css">

    <style>

        :root {
            --azul: #17365f;
            --azul-oscuro: #102744;
            --naranja: #e9820c;
            --naranja-hover: #cc6f06;
            --blanco: #ffffff;
            --crema: #fffdf9;
            --gris: #6f7785;
            --borde: #dfe3e8;
            --rojo: #d64545;
            --rojo-hover: #b93434;
            --verde: #29945a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family: "Segoe UI", Arial, sans-serif;

            background: url("imgs/Comidas.jpg") center/cover no-repeat;

            color: var(--azul);
        }

        /* CAPA SUAVE PARA QUE LA TARJETA RESALTE */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.12);

            pointer-events: none;
        }

        /* TARJETA */

        .perfil {
            position: relative;
            z-index: 1;

            width: 430px;
            max-width: 100%;

            padding: 32px;

            background: var(--crema);

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            animation: aparecer 0.35s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ENCABEZADO */

        .encabezado {
            margin-bottom: 24px;
        }

        .encabezado h1 {
            margin: 0;

            font-size: 27px;
            font-weight: 800;

            color: var(--azul);
        }

        .encabezado p {
            margin: 7px 0 0;

            font-size: 14px;

            color: var(--gris);
        }

        .decoracion {
            width: 55px;
            height: 4px;

            margin: 12px auto 0;

            border-radius: 20px;

            background: var(--naranja);
        }

        /* FOTO */

        .foto-container {
            position: relative;

            width: 130px;
            height: 130px;

            margin: 0 auto 25px;
        }

        #fotoPerfil {
            width: 130px;
            height: 130px;

            display: block;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid white;

            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.20);

            background: #eef1f5;
        }

        .foto-placeholder {
            width: 130px;
            height: 130px;
            display: block;
            overflow: hidden;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.20);
            background: #d0d0d0;
        }

        .foto-placeholder img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 50%;
        }

        /* BOTÓN CÁMARA */

        .icono-camara {
            position: absolute;

            right: 0;
            bottom: 2px;

            width: 40px;
            height: 40px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: var(--naranja);

            color: white;

            font-size: 19px;

            cursor: pointer;

            border: 3px solid var(--crema);

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.20);

            transition: 0.2s ease;
        }

        .icono-camara:hover {
            background: var(--naranja-hover);

            transform: scale(1.08);
        }

        /* BOTÓN ELIMINAR FOTO */

        .eliminar-foto {
            margin-top: 8px;

            border: none;

            background: transparent;

            color: var(--rojo);

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        .eliminar-foto:hover {
            text-decoration: underline;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 17px;

            text-align: left;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: var(--azul);
        }

        .input-contenedor {
            position: relative;
        }

        .campo input {
            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid var(--borde);

            border-radius: 12px;

            outline: none;

            background: white;

            color: var(--azul);

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .campo input:focus {
            border-color: var(--naranja);

            box-shadow:
                0 0 0 3px rgba(233, 130, 12, 0.12);
        }

        .campo input::placeholder {
            color: #a1a8b3;
        }

        /* OJO CONTRASEÑA */

        .boton-ojo {
            position: absolute;

            right: 7px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: none;

            border-radius: 8px;

            background: transparent;

            cursor: pointer;

            font-size: 17px;
        }

        .boton-ojo:hover {
            background: #f1f3f6;
        }

        .ojo {
            position: relative;

            display: inline-block;

            line-height: 1;
        }

        /* BARRA SOBRE EL OJO */

        .ojo.tachado::after {
            content: "";

            position: absolute;

            width: 25px;
            height: 2px;

            background: #6f7785;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                rotate(-45deg);

            border-radius: 2px;

            pointer-events: none;
        }

        /* INFORMACIÓN */

        .info {
            margin: 3px 0 20px;

            padding: 11px 13px;

            border-radius: 10px;

            background: #f3f6f9;

            color: var(--gris);

            font-size: 12px;

            text-align: left;
        }

        /* MENSAJE */

        #mensaje {
            min-height: 20px;

            margin: 8px 0 12px;

            text-align: center;

            font-size: 13px;

            font-weight: 700;
        }

        /* BOTONES */

        .boton {
            width: 100%;

            height: 48px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .boton:hover {
            transform: translateY(-1px);
        }

        .guardar {
            background: var(--naranja);

            color: white;
        }

        .guardar:hover {
            background: var(--naranja-hover);

            box-shadow:
                0 8px 18px rgba(233, 130, 12, 0.25);
        }

        .volver {
            background: #edf1f5;

            color: var(--azul);
        }

        .volver:hover {
            background: #e1e6eb;
        }

        .cerrar {
            background: #fff0f0;

            color: var(--rojo);
        }

        .cerrar:hover {
            background: #ffe2e2;
        }

        /* PIE */

        .pie {
            margin-top: 20px;

            color: #9aa1ac;

            font-size: 11px;
        }

        /* RESPONSIVE */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .perfil {
                padding: 27px 22px 24px;

                border-radius: 20px;
            }

            .encabezado h1 {
                font-size: 23px;
            }

        }

    </style>

</head>

<script>


/* ==========================================
   COMPROBAR SESIÓN
========================================== */

const usuarioActivo = localStorage.getItem("usuarioActivo");

/* ==========================================
   CARGAR PERFIL
========================================== */

window.addEventListener("load", function () {

    const usuario = localStorage.getItem("usuarioActivo");

    /* Cargar usuario solo si existe una sesión activa. */
    if (usuario) {
        document.getElementById("usuario").value = usuario;
    }


    /* Cargar correo */

    if (usuario) {
        const correo = localStorage.getItem("correo_" + usuario);
        if (correo) {
            document.getElementById("correo").value = correo;
        }
    }

    /* Cargar foto guardada */
    // Primero busca la foto del usuario y, si no existe, la foto general.
    // De esta manera la foto NO desaparece al recargar perfil.html.
    const foto = usuario
        ? (localStorage.getItem("fotoPerfil_" + usuario) || localStorage.getItem("fotoPerfil"))
        : localStorage.getItem("fotoPerfil");

    if (foto) {
        mostrarFotoGuardada(foto);
    }

});


/* ==========================================
   MOSTRAR / OCULTAR CONTRASEÑA
========================================== */

function togglePassword() {

    const password =
        document.getElementById("password");

    const ojo =
        document.querySelector(".ojo");


    if (password.type === "password") {

        password.type = "text";

        ojo.classList.remove("tachado");

    } else {

        password.type = "password";

        ojo.classList.add("tachado");

    }

}


/* ==========================================
   MOSTRAR FOTO / PLACEHOLDER
========================================== */

function mostrarFotoGuardada(imagen) {
    const contenedor = document.getElementById("fotoPerfil");
    if (!contenedor) return;

    contenedor.innerHTML = "";

    const img = document.createElement("img");
    img.src = imagen;
    img.alt = "Foto de perfil";
    img.style.width = "100%";
    img.style.height = "100%";
    img.style.display = "block";
    img.style.objectFit = "cover";
    img.style.borderRadius = "50%";

    contenedor.appendChild(img);
}

/* ==========================================
   CAMBIAR FOTO
========================================== */

function cambiarFoto(event) {

    const archivo = event.target.files[0];
    if (!archivo) return;

    if (!archivo.type.startsWith("image/")) {
        mostrarMensaje("⚠️ Elegí un archivo de imagen.", "#d64545");
        event.target.value = "";
        return;
    }

    /*
       Reducimos la imagen antes de guardarla.
       Esto evita que localStorage se quede sin espacio cuando
       el usuario selecciona una foto grande del celular/PC.
    */
    const lector = new FileReader();

    lector.onload = function (e) {
        const imagenOriginal = new Image();

        imagenOriginal.onload = function () {
            const maximo = 900;
            let ancho = imagenOriginal.naturalWidth;
            let alto = imagenOriginal.naturalHeight;

            if (ancho > maximo || alto > maximo) {
                const escala = Math.min(maximo / ancho, maximo / alto);
                ancho = Math.round(ancho * escala);
                alto = Math.round(alto * escala);
            }

            const canvas = document.createElement("canvas");
            canvas.width = ancho;
            canvas.height = alto;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(imagenOriginal, 0, 0, ancho, alto);

            const imagen = canvas.toDataURL("image/jpeg", 0.82);
            const usuario = localStorage.getItem("usuarioActivo");

            try {
                /* Guardar en pantalla inmediatamente. */
                mostrarFotoGuardada(imagen);

                /* Guardar para el usuario y también como respaldo general. */
                if (usuario) {
                    localStorage.setItem("fotoPerfil_" + usuario, imagen);
                }
                localStorage.setItem("fotoPerfil", imagen);

                /* Comprobar que realmente quedó guardada. */
                const comprobacion = usuario
                    ? localStorage.getItem("fotoPerfil_" + usuario)
                    : localStorage.getItem("fotoPerfil");

                if (!comprobacion) {
                    throw new Error("No se pudo guardar la foto");
                }

                event.target.value = "";
                mostrarMensaje("✅ Foto guardada correctamente. Al recargar seguirá ahí.", "#29945a");
            } catch (error) {
                console.error(error);
                mostrarMensaje("⚠️ La foto es demasiado grande. Probá con otra imagen.", "#d64545");
            }
        };

        imagenOriginal.onerror = function () {
            mostrarMensaje("⚠️ No se pudo cargar la imagen.", "#d64545");
        };

        imagenOriginal.src = e.target.result;
    };

    lector.readAsDataURL(archivo);

}

/* ==========================================
   ELIMINAR FOTO
========================================== */

function eliminarFoto() {

    const usuario =
        localStorage.getItem("usuarioActivo");

    // Borrar la foto guardada para que desaparezca de forma permanente.
    if (usuario) {
        localStorage.removeItem(
            "fotoPerfil_" + usuario
        );
    }
    localStorage.removeItem("fotoPerfil");

    // Borrar la foto de la pantalla INMEDIATAMENTE.
    mostrarPlaceholderFoto();

    // Permitir volver a seleccionar la misma foto.
    const input =
        document.getElementById("inputFoto");

    if (input) {
        input.value = "";
    }

    mostrarMensaje(
        "✅ Foto eliminada.",
        "#29945a"
    );

}

/* ==========================================
   GUARDAR CAMBIOS
========================================== */

function guardar() {

    const usuarioAnterior =
        localStorage.getItem("usuarioActivo");


    const nuevoUsuario =
        document.getElementById("usuario").value.trim();


    const nuevoCorreo =
        document.getElementById("correo").value.trim();


    const nuevaPassword =
        document.getElementById("password").value;


    /* Validaciones */

    if (nuevoUsuario === "") {

        mostrarMensaje(
            "⚠️ Ingresá un nombre de usuario.",
            "#d64545"
        );

        return;

    }


    if (nuevoCorreo === "") {

        mostrarMensaje(
            "⚠️ Ingresá un correo electrónico.",
            "#d64545"
        );

        return;

    }


    if (
        nuevaPassword !== "" &&
        nuevaPassword.length < 6
    ) {

        mostrarMensaje(
            "⚠️ La contraseña debe tener al menos 6 caracteres.",
            "#d64545"
        );

        return;

    }


    /* Obtener datos anteriores */

    const contraseñaAnterior =
        localStorage.getItem(usuarioAnterior);


    const correoAnterior =
        localStorage.getItem(
            "correo_" + usuarioAnterior
        );


    /* Si cambió el usuario */

    if (
        nuevoUsuario !== usuarioAnterior &&
        localStorage.getItem(nuevoUsuario)
    ) {

        mostrarMensaje(
            "⚠️ Ese nombre de usuario ya existe.",
            "#d64545"
        );

        return;

    }


    /* Guardar usuario */

    if (nuevoUsuario !== usuarioAnterior) {

        if (contraseñaAnterior !== null) {

            localStorage.setItem(
                nuevoUsuario,
                nuevaPassword !== ""
                    ? nuevaPassword
                    : contraseñaAnterior
            );

        }


        if (correoAnterior !== null) {

            localStorage.setItem(
                "correo_" + nuevoUsuario,
                nuevoCorreo
            );

        }


        localStorage.removeItem(
            usuarioAnterior
        );


        localStorage.removeItem(
            "correo_" + usuarioAnterior
        );


        /* Mantener la foto de perfil al cambiar el usuario */
        const fotoAnterior =
            localStorage.getItem("fotoPerfil_" + usuarioAnterior);

        if (fotoAnterior) {
            localStorage.setItem(
                "fotoPerfil_" + nuevoUsuario,
                fotoAnterior
            );

            localStorage.removeItem(
                "fotoPerfil_" + usuarioAnterior
            );
        }


        /* Actualizar usuario activo */

        localStorage.setItem(
            "usuarioActivo",
            nuevoUsuario
        );

    } else {

        /* Guardar correo */

        localStorage.setItem(
            "correo_" + nuevoUsuario,
            nuevoCorreo
        );


        /* Cambiar contraseña solamente si se escribió */

        if (nuevaPassword !== "") {

            localStorage.setItem(
                nuevoUsuario,
                nuevaPassword
            );

        }

    }


    /* Limpiar contraseña */

    document.getElementById("password").value =
        "";


    mostrarMensaje(
        "✅ Perfil actualizado correctamente.",
        "#29945a"
    );

}


/* ==========================================
   MENSAJES
========================================== */

function mostrarMensaje(texto, color) {

    const mensaje =
        document.getElementById("mensaje");


    mensaje.textContent =
        texto;


    mensaje.style.color =
        color;


    setTimeout(function () {

        mensaje.textContent = "";

    }, 3000);

}


/* ==========================================
   CERRAR SESIÓN
========================================== */

function cerrarSesion() {

    localStorage.removeItem(
        "usuarioActivo"
    );


    localStorage.removeItem(
        "logueado"
    );

}


</script>
