<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta - Delicious Food</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #193965;
        }

        .barra {
            background: #193965;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .barra h1 {
            font-size: 24px;
        }

        .volver {
            background: #f28a00;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .contenedor {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .titulo {
            margin-bottom: 25px;
        }

        .titulo h2 {
            margin-bottom: 8px;
        }

        .perfil {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .foto {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .datos {
            line-height: 1.8;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .boton {
            background: #f28a00;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <header class="barra">

        <h1>🍔 Delicious Food</h1>

        <a href="jefe.html" class="volver">
            ← Volver al Panel de Jefes
        </a>

    </header>


    <main class="contenedor">

        <section class="panel">

            <div class="titulo">

                <h2>👤 Mi cuenta</h2>

                <p>
                    Información y configuración de la cuenta del jefe.
                </p>

            </div>


            <div class="perfil">

    <div>
        <div class="foto" id="fotoPerfil">
            👨‍💼
        </div>

        <input
            type="file"
            id="inputFoto"
            accept="image/*"
            style="display: none;"
        >

        <button
            class="boton"
            type="button"
            onclick="document.getElementById('inputFoto').click()"
            style="margin-top: 12px;"
        >
            📷 Cambiar foto de perfil
        </button>
    </div>

       <div class="datos">

        <strong>Jefe</strong>

        <br>

        Administrador de Delicious Food

    </div>

        </div>

            <div class="campo">

                <label>Nombre</label>

                <input
                    type="text"
                    value="Jefe"
                >

            </div>


            <div class="campo">

                <label>Correo electrónico</label>

                <input
                    type="email"
                    value=""
                    placeholder="Correo del jefe"
                >

            </div>


            <div class="campo">

                <label>Teléfono</label>

                <input
                    type="tel"
                    placeholder="Número de teléfono"
                >

            </div>


            <button class="boton" type="button" onclick="guardarCambios()">
                Guardar cambios
            </button>
            <p id="mensajeGuardado" style="
            display: none;
          margin-top: 15px;
          color: #23833d;
          font-weight: bold;"
>

    ✅ Los cambios han sido guardados.
</p>

</section>

</main>
<input
    type="email"
    value="gerencia.deliciousfood@gmail.com"
>
<script>
function guardarCambios() {
    document.getElementById("mensajeGuardado").style.display = "block";
}
</script>

</body>

</html>
